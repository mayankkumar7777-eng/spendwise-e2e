openapi: 3.1.0
info:
  title: SpendWise API
  version: 1.0.0
  description: >
    Expense claims API. Money is a string with 2 decimals (e.g. "1234.50"); dates are ISO 8601.
    Errors use {"error":{"code","message","fields":[{"field","code","message"}]}}.
    State-changing requests with a foreign Origin header are rejected with 403 FORBIDDEN.
servers:
  - url: http://localhost:3000
security:
  - sessionCookie: []
paths:
  /api/health:
    get:
      summary: Health (FR-12)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/auth/login:
    post:
      summary: Log in (FR-01)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '200':
          description: User; sets HttpOnly SameSite=Lax session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      summary: Log out
      security: []
      responses:
        '204': { description: Logged out }
  /api/me:
    get:
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /api/claims:
    get:
      summary: List own claims (all claims for Finance) (FR-05)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Submitted, Approved, Rejected] } }
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Page of 20, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Claim' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  sumAmount: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Submit a claim (FR-02, FR-03, FR-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ClaimMultipart' }
      responses:
        '201':
          description: Created (auto-approved when amount <= 500.00)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/claims/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: '^CLM-\d{4,}$' } }
    get:
      summary: Claim with history (FR-08); owner, their manager, Finance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Edit own Submitted claim (FR-06); JSON or multipart (receipt replacement)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ClaimMultipart' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete own Submitted claim (FR-06)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/claims/{id}/receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Receipt file (FR-13); owner, their manager, Finance only
      responses:
        '200':
          description: image/jpeg, image/png or application/pdf
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/team/claims:
    get:
      summary: Direct reports' claims, default status Submitted (FR-07)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [Submitted, Approved, Rejected], default: Submitted } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Claim' } }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
  /api/claims/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Approve a direct report's claim
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/claims/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Reject with a comment of at least 5 characters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties: { comment: { type: string, minLength: 5 } }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/reports/monthly:
    get:
      summary: Finance monthly report (FR-09); month is the claim-date month
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/reports/monthly.csv:
    get:
      summary: Finance CSV export of approved claims (FR-10)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: UTF-8 CSV; cells starting with = + - @ are prefixed with '
          content:
            text/csv: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: sid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Health:
      type: object
      properties: { status: { type: string, enum: [ok] }, version: { type: string } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, INVALID_CREDENTIALS, ACCOUNT_LOCKED, VALIDATION_FAILED, DUPLICATE_CLAIM, CLAIM_LOCKED, SELF_APPROVAL_NOT_ALLOWED, COMMENT_REQUIRED, TOO_MANY_ATTEMPTS, PAYLOAD_TOO_LARGE, BAD_REQUEST
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code:
                    type: string
                    description: AMOUNT_INVALID, AMOUNT_OUT_OF_RANGE, AMOUNT_PRECISION, DATE_INVALID, DATE_IN_FUTURE, DATE_BEFORE_POLICY_START, INVALID_CATEGORY, DESCRIPTION_LENGTH, MEALS_LIMIT_EXCEEDED, RECEIPT_REQUIRED, FILE_TOO_LARGE, FILE_TYPE_NOT_ALLOWED, INVALID_FILTER
                  message: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [Employee, Manager, Finance] }
        managerId: { type: [string, 'null'] }
    ClaimInput:
      type: object
      properties:
        date: { type: string, format: date }
        category: { type: string, enum: [Travel, Meals, Lodging, Office Supplies, Internet & Phone, Training] }
        amount: { type: string, description: '1.00 to 100000.00, max 2 decimals' }
        description: { type: string, minLength: 3, maxLength: 200 }
        confirmDuplicate: { type: boolean }
    ClaimMultipart:
      allOf:
        - { $ref: '#/components/schemas/ClaimInput' }
        - type: object
          properties:
            receipt: { type: string, format: binary, description: 'JPG, PNG or PDF, max 2 MB' }
    Claim:
      type: object
      properties:
        id: { type: string, pattern: '^CLM-\d{4,}$' }
        employeeEmail: { type: string }
        employeeName: { type: string }
        date: { type: string, format: date }
        category: { type: string }
        amount: { type: string }
        description: { type: string }
        hasReceipt: { type: boolean }
        status: { type: string, enum: [Submitted, Approved, Rejected] }
        decidedBy: { type: [string, 'null'], description: "'system' or approver email" }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionComment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClaimDetail:
      allOf:
        - { $ref: '#/components/schemas/Claim' }
        - type: object
          properties:
            history:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, enum: [created, edited, approved, rejected] }
                  actor: { type: string }
                  actorName: { type: string }
                  at: { type: string, format: date-time }
                  comment: { type: [string, 'null'] }
    Report:
      type: object
      properties:
        month: { type: string }
        byCategory:
          type: array
          items:
            type: object
            properties: { category: { type: string }, total: { type: string }, count: { type: integer } }
        byEmployee:
          type: array
          items:
            type: object
            properties: { employeeEmail: { type: string }, employeeName: { type: string }, total: { type: string }, count: { type: integer } }
        statusCounts:
          type: object
          properties: { Submitted: { type: integer }, Approved: { type: integer }, Rejected: { type: integer } }
        grandTotal: { type: string }
        approvedCount: { type: integer }
